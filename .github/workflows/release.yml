name: Build and Release Single-File Executables

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push a tag like v1.0.0

jobs:
  build-and-release:
    name: Build for ${{ matrix.runtime.name }}
    runs-on: ${{ matrix.runtime.os }}

    strategy:
      fail-fast: false
      matrix:
        runtime:
          - id: win-x64
            name: Windows x64
            os: windows-latest
            extension: .exe
          - id: linux-x64
            name: Linux x64
            os: ubuntu-latest
            extension: ''
          - id: osx-x64
            name: macOS Intel
            os: macos-latest
            extension: ''
          - id: osx-arm64
            name: macOS Apple Silicon
            os: macos-latest
            extension: ''

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore PersonalFinanceApp.Desktop/PersonalFinanceApp.Desktop.csproj

      - name: Publish Self-Contained Single File (Windows)
        if: runner.os == 'Windows'
        run: |
          dotnet publish PersonalFinanceApp.Desktop/PersonalFinanceApp.Desktop.csproj -c Release -r ${{ matrix.runtime.id }} --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o ./publish

      - name: Publish Self-Contained Single File (Unix)
        if: runner.os != 'Windows'
        run: |
          dotnet publish PersonalFinanceApp.Desktop/PersonalFinanceApp.Desktop.csproj \
            -c Release \
            -r ${{ matrix.runtime.id }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishReadyToRun=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=false \
            -o ./publish

      - name: Prepare Artifact Folder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./artifact_folder
          $ext = "${{ matrix.runtime.extension }}"
          $id = "${{ matrix.runtime.id }}"
          Move-Item -Path "./publish/PersonalFinanceApp.Desktop$ext" -Destination "./artifact_folder/PersonalFinanceApp-$id$ext"

      - name: Prepare Artifact Folder (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          EXT: ${{ matrix.runtime.extension }}
          RID: ${{ matrix.runtime.id }}
        run: |
          mkdir -p ./artifact_folder
          mv "./publish/PersonalFinanceApp.Desktop${EXT}" "./artifact_folder/PersonalFinanceApp-${RID}${EXT}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finance-app-${{ matrix.runtime.id }}
          path: ./artifact_folder/*

  release:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-artifacts

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./all-artifacts/finance-app-win-x64/*
            ./all-artifacts/finance-app-linux-x64/*
            ./all-artifacts/finance-app-osx-x64/*
            ./all-artifacts/finance-app-osx-arm64/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}